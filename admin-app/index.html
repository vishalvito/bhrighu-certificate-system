<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Bhrighu Admin
    </title>

    <link
        rel="stylesheet"
        href="css/app.css"
    >
    <link
    rel="manifest"
    href="manifest.json"
>

<meta
    name="theme-color"
    content="#0d0d0d"
>

<meta
    name="mobile-web-app-capable"
    content="yes"
>

</head>


<body>

    <main class="app">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="app-header">

            <div>

                <span class="eyebrow">
                    BHRIGHU ADVENTURE
                </span>

                <h1>
                    Admin
                </h1>

            </div>

            <div class="admin-avatar">
                VT
            </div>

        </header>


        <!-- =========================
             LOGIN
        ========================== -->

        <section
            class="login-card"
            id="loginSection"
        >

            <span class="section-label">
                PRIVATE ACCESS
            </span>

            <h2>
                Bhrighu Admin
            </h2>

            <p>
                Enter your private admin PIN 
                to open the app.
            </p>


            <label for="adminPin">
                Admin PIN
            </label>

                <input
                    id="adminPin"
                    class="otp-input"
                    type="password"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="enter PIN"
                >



            <button
                class="primary-btn"
                id="loginBtn"
                type="button"
            >
                Open admin app
        </button>


            <p
                class="login-message"
                id="loginMessage"
            ></p>

        </section>


        <!-- =========================
             ADMIN CONTENT
        ========================== -->

        <section
            id="adminSection"
            hidden
        >

            <div class="welcome-card">

                <span class="section-label">
                    TODAY
                </span>

                <h2>
                    Course Enquiries
                </h2>

                <p>
                    Everything important
                    in one place.
                </p>

            </div>


            <!-- STATS -->

            <div class="stats-grid">

                <div class="stat-card">

                    <strong id="totalCount">
                        0
                    </strong>

                    <span>
                        Total
                    </span>

                </div>


                <div class="stat-card">

                    <strong id="newCount">
                        0
                    </strong>

                    <span>
                        New
                    </span>

                </div>


                <div class="stat-card">

                    <strong id="confirmedCount">
                        0
                    </strong>

                    <span>
                        Confirmed
                    </span>

                </div>


                <div class="stat-card">

                    <strong id="certificateCount">
                        0
                    </strong>

                    <span>
                        Certificates
                    </span>

                </div>

            </div>


            <!-- SEARCH -->

            <div class="search-area">

                <input
                    id="searchEnquiries"
                    type="search"
                    placeholder="Search name or phone..."
                >

            </div>


            <!-- ENQUIRIES -->

            <div
                class="enquiry-list"
                id="enquiryList"
            >

                <div class="empty-state">

                    <div class="empty-icon">
                        📥
                    </div>

                    <h3>
                        Enquiries
                    </h3>

                    <p>
                        Your course enquiries
                        will appear here.
                    </p>

                </div>

            </div>


            <!-- LOGOUT -->

            <button
                class="logout-btn"
                id="logoutBtn"
                type="button"
            >
                Sign Out
            </button>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase-course.js"></script>

    <script src="js/app.js"></script>

    <script>
    if ("serviceWorker" in navigator) {

        window.addEventListener(
            "load",
            function() {

                navigator
                    .serviceWorker
                    .register(
                        "./service-worker.js"
                    )
                    .then(
                        function() {
                            console.log(
                                "Bhrighu Admin App ready."
                            );
                        }
                    )
                    .catch(
                        function(error) {
                            console.error(
                                "Service worker error:",
                                error
                            );
                        }
                    );

            }
        );

    }
</script>

</body>

</html>
